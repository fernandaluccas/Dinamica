<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Casa Botânica</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header class="header-container">
        <img src="imagens\Logo-Header.png" alt="Logo Casa Botânica">
        <nav>
            <ul class="nav-links">
                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Kits</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
        <a href="#" class="btn-catalogo">Explorar Catálogo</a>
    </header>
<main>
    <section class="hero">
        <img src="imagens/Background-Img.png" alt="Decoração de folha" class="leaf-decor">
        <div class="hero-conteudo">
        <p class="tagline">Cultivo natural • Bem-estar • Sustentabilidade</p>
        <h1>Transforme seu espaço com o <span>poder das plantas</span></h1>
        <p class="descricao">Selecionamos plantas ideais para sua rotina e seu ambiente,
            com orientação completa para você cuidar sem complicação</p>
        
        <div class="botoes">
            <button class="btn-principal">Explorar Plantas</button>
            <button class="btn-secundario">Montar Meu Kit</button>
        </div>
        </div>
        <div class="hero-imagem">
            <img src="imagens/hero-image.png" alt="Imagem de destaque da Casa Botânica">
        </div>
    </section>
</body>
</html>
